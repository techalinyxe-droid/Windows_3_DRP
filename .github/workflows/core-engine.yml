name: ⚙️ Bullet Core Engine

permissions:
  contents: read
  actions: write

on:
  workflow_call:
    inputs:
      cycles:
        required: true
        type: string
      ts_authkey:
        required: true
        type: string
      ts_tailnet:
        required: false
        type: string
        default: ""
      ts_api_key:
        required: false
        type: string
        default: ""
      runtime_minutes:
        required: false
        type: string
        default: "355"
      mode:
        required: false
        type: string
        default: "SESSION"

  workflow_dispatch:
    inputs:
      cycles:
        description: "Nombre de cycles"
        required: true
        default: "1"
      ts_authkey:
        description: "Tailscale Auth Key"
        required: true
        default: ""
      ts_tailnet:
        description: "Tailscale Tailnet (optionnel)"
        required: false
        default: ""
      ts_api_key:
        description: "Tailscale API Key (optionnel)"
        required: false
        default: ""
      runtime_minutes:
        description: "Durée d'exécution en minutes"
        required: false
        default: "355"
      mode:
        description: "Mode SESSION_A / SESSION_B / RESTART"
        required: false
        default: "SESSION"

jobs:
  engine:
    runs-on: windows-latest
    timeout-minutes: 370
    env:
      RDP_USER: Bullettemporary
      NOTIFY_URL: ${{ secrets.RENDER_URL }}/notify
      NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
      B2_BUCKET: ${{ secrets.B2_BUCKET_NAME }}
    steps:
      # ---------- NOTIFICATION DÉMARRAGE ----------
      - name: 📢 Notification : Début
        run: |
          $headers = @{ Authorization = "Bearer $env:NOTIFY_TOKEN" }
          $body = @{ message="🚀 ${{ inputs.mode }} démarrée (Cycles: ${{ inputs.cycles }})" } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri $env:NOTIFY_URL -Method Post -Headers $headers -Body $body -ContentType "application/json" -ErrorAction Stop
          } catch {
            Write-Warning "Notification de démarrage échouée : $_"
          }

      # ---------- INSTALLATIONS ----------
      - name: 🛠️ Installations & dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyautogui pynput pillow requests
          netsh advfirewall firewall add rule name="RustDesk-TCP" dir=in action=allow protocol=TCP localport=21115-21119
          netsh advfirewall firewall add rule name="RustDesk-UDP" dir=in action=allow protocol=UDP localport=21116
          winget install --id RustDesk.RustDesk --accept-source-agreements --accept-package-agreements --silent
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "EnableLUA" -Value 0
          Set-MpPreference -DisableRealtimeMonitoring $true

      # ---------- RESTAURATION B2 (conditionnée au mode RESTART) ----------
      - name: 📥 Restauration B2 (données persistantes)
        env:
          B2_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "$env:TEMP\rclone.zip"
          Expand-Archive -Path "$env:TEMP\rclone.zip" -DestinationPath "$env:TEMP\rclone" -Force
          $rcloneExe = (Get-ChildItem "$env:TEMP\rclone\rclone-*\rclone.exe" | Select-Object -First 1).FullName
          "RCLONE_EXE=$rcloneExe" | Out-File -Append $env:GITHUB_ENV
          Write-Host "✅ rclone installé : $rcloneExe"

          $env:RCLONE_CONFIG_MYB2_TYPE = "b2"
          $env:RCLONE_CONFIG_MYB2_ACCOUNT = $env:B2_ID
          $env:RCLONE_CONFIG_MYB2_KEY = $env:B2_KEY
          $env:RCLONE_CONFIG_MYB2_ENDPOINT = ${{ secrets.B2_ENDPOINT }}

          $mode = "${{ inputs.mode }}".ToUpper()
          if ($mode -like "*RESTART*") {
              Write-Host "📥 Restauration des données..."
              & "$rcloneExe" copy "myb2:$env:B2_BUCKET/userdata" "C:\Users\$env:RDP_USER" --create-empty-src-dirs --fast-list
              Write-Host "✅ Données restaurées depuis B2 (mode $mode)"
          } else {
              Write-Host "ℹ️ Mode $mode : pas de restauration (machine neuve)"
          }

      # ---------- RÉSEAU & CONNEXION ----------
      - name: 🌐 Réseau & Connexion (Tailscale + RDP)
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ts.msi"
          Start-Process msiexec.exe -ArgumentList "/i","$env:TEMP\ts.msi","/quiet" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey "${{ inputs.ts_authkey }}" --hostname "bullet" --accept-dns=true

          $sec = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force
          New-LocalUser -Name "$env:RDP_USER" -Password $sec -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "$env:RDP_USER" -ErrorAction SilentlyContinue
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $ip = cmd /c '"C:\Program Files\Tailscale\tailscale.exe" ip -4'
          $headers = @{ Authorization = "Bearer $env:NOTIFY_TOKEN" }
          $body = @{ message="🌐 IP: $ip" } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri $env:NOTIFY_URL -Method Post -Headers $headers -Body $body -ContentType "application/json" -ErrorAction Stop
          } catch {
            Write-Warning "Notification IP échouée : $_"
          }

      # ---------- BOUCLE DE COMMANDES ----------
      - name: 🕹️ Boucle de commandes
        uses: ./.github/actions/command-dispatcher
        with:
          rclone_exe: ${{ env.RCLONE_EXE }}
          bucket: ${{ secrets.B2_BUCKET_NAME }}
          b2_application_key_id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          b2_application_key: ${{ secrets.B2_APPLICATION_KEY }}
          b2_endpoint: ${{ secrets.B2_ENDPOINT }}
          notify_url: ${{ secrets.RENDER_URL }}/notify
          notify_token: ${{ secrets.NOTIFY_TOKEN }}
          runtime_minutes: ${{ inputs.runtime_minutes }}
          mode: ${{ inputs.mode }}

      # ---------- SAUVEGARDE FINALE & RELAIS ----------
      - name: 🔄 Sauvegarde finale & Relais (Ping-Pong)
        if: always()
        run: |
          if (-not (Test-Path $env:RCLONE_EXE)) {
            Write-Error "rclone introuvable à $env:RCLONE_EXE"
            exit 1
          }
          & "$env:RCLONE_EXE" sync "C:\Users\$env:RDP_USER" "myb2:$env:B2_BUCKET/userdata" --quiet
          $c = [int]"${{ inputs.cycles }}"
          if ($c -gt 0) {
              $next = $c - 1
              $target = if ("${{ inputs.mode }}" -like "*A*") { "session-B.yml" } else { "session-A.yml" }
              $body = @{
                ref = "${{ github.ref_name }}"
                inputs = @{
                  cycles = "$next"
                  ts_authkey = "${{ inputs.ts_authkey }}"
                  mode = if ("${{ inputs.mode }}" -like "*A*") { "SESSION_B" } else { "SESSION_A" }
                }
              } | ConvertTo-Json -Depth 10
              $headers = @{
                Authorization = "Bearer ${{ secrets.GH_PAT }}"
                Accept = "application/vnd.github+json"
              }
              Invoke-RestMethod -Method POST -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$target/dispatches" -Headers $headers -Body $body -ContentType "application/json"

              # Notification relais
              $notifHeaders = @{ Authorization = "Bearer $env:NOTIFY_TOKEN" }
              $bodyNotif = @{ message="💾 Sauvegarde finale effectuée. Relance $target (cycles restants: $next)" } | ConvertTo-Json
              try {
                Invoke-RestMethod -Uri $env:NOTIFY_URL -Method Post -Headers $notifHeaders -Body $bodyNotif -ContentType "application/json" -ErrorAction Stop
              } catch {
                Write-Warning "Notification relais échouée : $_"
              }
          } else {
              $notifHeaders = @{ Authorization = "Bearer $env:NOTIFY_TOKEN" }
              $bodyNotif = @{ message="🛑 Session terminée." } | ConvertTo-Json
              try {
                Invoke-RestMethod -Uri $env:NOTIFY_URL -Method Post -Headers $notifHeaders -Body $bodyNotif -ContentType "application/json" -ErrorAction Stop
              } catch {
                Write-Warning "Notification de fin échouée : $_"
              }
          }
