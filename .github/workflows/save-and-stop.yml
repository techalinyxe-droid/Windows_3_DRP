name: 🛑 Save & Stop

on:
  workflow_dispatch:

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Send Stop Signal to B2
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/
          rclone config create myb2 b2 account="$B2_APPLICATION_KEY_ID" key="$B2_APPLICATION_KEY" endpoint="$B2_ENDPOINT"
          echo "stop" > stop-now.lock
          rclone copy stop-now.lock "myb2:$B2_BUCKET_NAME/"
          echo "✅ Signal d'arrêt déposé sur B2."
